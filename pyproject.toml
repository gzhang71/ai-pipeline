[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Applied context and prompt engineering experiments"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "prompt", "harness", "loop", "context", "graph"]

[tool.pytest.ini_options]
testpaths = ["common", "prompt", "harness", "loop", "context", "graph"]
python_files = ["test_*.py"]
addopts = "-q"
